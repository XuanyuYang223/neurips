# Frozen nested scaling condition: original v3 data and exposure, with twice
# the model depth. The Transformer uses 8 rather than 4 layers and the causal
# MLP uses 2 rather than 1 token-mixing blocks.

protocol_version = "henry-permutation/v3-scaling-data1x-model2x"
dataset_protocol_version = "permutation-20/v3"
status = "planned_not_trained"
dataset_manifest = "data/permutation-10m-v3/manifest.json"
validation_manifest = "data/permutation-10m-v3/manifest.json"
test_manifest = "data/permutation-10m-v3/test_manifest.json"
output_dir = "runs/permutation-scaling-v3/data1x-model2x"
task_order_seed = 20260830
task_subset_sizes = [1, 2, 4, 8, 16]
architectures = ["transformer", "mlp"]
model_seeds = [17, 42, 314159]

task_order = [
  "recoils",
  "lis_length",
  "fixed_points",
  "to_inversion_vector",
  "pattern_avoidance",
  "lds_length",
  "right_multiply_simple",
  "inverse",
  "to_cycle",
  "descents",
  "length",
  "rsk_shape",
  "peaks",
  "cycle_type",
  "bruhat_leq",
  "exceedances",
  "to_reduced_word",
  "compose",
  "parity",
  "to_lehmer",
]
holdout_tasks = ["to_reduced_word", "compose", "parity", "to_lehmer"]

[scaling]
condition = "data1x_model2x"
data_multiplier = 1
model_multiplier = 2
training_examples_per_run = 1280000
baseline_config = "configs/henry_permutation_revised.toml"

[dataset_artifact]
training_manifest_sha256 = "b20a16cee7710cee4a21cc4575c8651ade1bcfca18219d2e6c230d4a3ab0cf6f"
validation_manifest_sha256 = "b20a16cee7710cee4a21cc4575c8651ade1bcfca18219d2e6c230d4a3ab0cf6f"
test_manifest_sha256 = "3ca12e6b6eeb29fc0ddd441b9c44c80d7a160faaf7e832eb55007f4c6a3ab52b"
training_parent_records = 10000000
training_used_records = 9800000

[data]
train_shards = "000-097"
validation_shards = "098"
test_shards = "099"
shuffle_buffer = 10000
max_sequence_length = 1024

[model]
d_model = 256
transformer_layers = 8
mlp_layers = 2
num_heads = 8
ff_multiplier = 4
dropout = 0.1
tie_embeddings = true

[training]
max_steps = 20000
micro_batch_size = 16
gradient_accumulation_steps = 4
max_tokens_per_batch = 4096
learning_rate = 0.0003
min_learning_rate_ratio = 0.1
weight_decay = 0.01
warmup_steps = 1000
gradient_clip_norm = 1.0
precision = "bf16"
validate_every_steps = 1000
validation_batches_per_task = 5
checkpoint_every_steps = 1000
num_workers = 0
