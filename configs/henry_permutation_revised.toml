# Revised design after Henry Kvinge's task-selection feedback.  Henry suggested
# removing the three difficult v2 tasks and comparing task categories; choosing
# peaks, exceedances, and recoils as replacements is this project's decision.
#
# Dataset status: generated and fully verified.  Model status: NOT TRAINED.
# The schema-aware 30-run nested plan and dry-run were reviewed on 2026-08-30.
# The 18-run E4/S4/A4 category plan, dry-run, resume, and strict audit paths
# are implemented and reviewed.  The two matrices use isolated output paths.

protocol_version = "henry-permutation/v2-revised"
dataset_protocol_version = "permutation-20/v3"
status = "planned_not_trained"
dataset_status = "generated_full_verified"
supersedes_for_main_experiment = "configs/henry_permutation.toml"
baseline_config = "configs/henry_permutation.toml"
dataset_manifest = "data/permutation-10m-v3/manifest.json"
validation_manifest = "data/permutation-10m-v3/manifest.json"
test_manifest = "data/permutation-10m-v3/test_manifest.json"
output_dir = "runs/henry-permutation-v3"
task_order_seed = 20260830
task_subset_sizes = [1, 2, 4, 8, 16]
architectures = ["transformer", "mlp"]
model_seeds = [17, 42, 314159]

# Start from random.Random(20260830).shuffle(canonical_v3_task_list), then move
# the preregistered v2 holdout identities to the final four slots while
# preserving relative order.  Keeping the same holdouts enables a direct
# v2-versus-v3 comparison and retains an algebra task in the holdout set.
task_order = [
  "recoils",
  "lis_length",
  "fixed_points",
  "to_inversion_vector",
  "pattern_avoidance",
  "lds_length",
  "right_multiply_simple",
  "inverse",
  "to_cycle",
  "descents",
  "length",
  "rsk_shape",
  "peaks",
  "cycle_type",
  "bruhat_leq",
  "exceedances",
  "to_reduced_word",
  "compose",
  "parity",
  "to_lehmer",
]
holdout_tasks = ["to_reduced_word", "compose", "parity", "to_lehmer"]

[task_revision]
# Henry proposed the removals.  The added properties are a project choice made
# to preserve a balanced 20-task suite.
removed = ["power", "conjugate", "commutator"]
added = ["peaks", "exceedances", "recoils"]
records_per_added_task = 500000
total_tasks = 20
total_records = 10000000

[dataset_artifact]
record_count = 10000000
shard_count = 100
compressed_bytes = 1139175228
manifest_sha256 = "b20a16cee7710cee4a21cc4575c8651ade1bcfca18219d2e6c230d4a3ab0cf6f"
generation_seconds = 43.76
full_verification_seconds = 34.59
train_count = 9800000
validation_count = 100000
test_count = 100000
train_manifest_sha256 = "7ad40c63a7559c52640d233a5398125d14160d83acadfa30637de291292893fa"
validation_manifest_sha256 = "90e88845f3f58947f317c67144c83bc5e38c27b248227e311632af834d2fd068"
test_manifest_sha256 = "3ca12e6b6eeb29fc0ddd441b9c44c80d7a160faaf7e832eb55007f4c6a3ab52b"

[data]
train_shards = "000-097"
validation_shards = "098"
test_shards = "099"
shuffle_buffer = 10000
max_sequence_length = 1024

[model]
# Keep the standard small pre-LN decoder-only Transformer.  Matching the
# original PermuFormer architecture is not a goal of the revised study.
d_model = 256
transformer_layers = 4
mlp_layers = 1
num_heads = 8
ff_multiplier = 4
dropout = 0.1
tie_embeddings = true

[training]
max_steps = 20000
micro_batch_size = 16
gradient_accumulation_steps = 4
max_tokens_per_batch = 4096
learning_rate = 0.0003
min_learning_rate_ratio = 0.1
weight_decay = 0.01
warmup_steps = 1000
gradient_clip_norm = 1.0
precision = "bf16"
validate_every_steps = 1000
validation_batches_per_task = 5
checkpoint_every_steps = 1000
num_workers = 0

# This matched task-count design is the project's operationalization of Henry's
# category-comparison suggestion.  It holds task count, per-task corpus size,
# model, optimizer, and update budget fixed.
# Category runs are selected with `permutation-experiments --matrix category`.
# E4 uses smaller micro-batches and more accumulation because reduced-word
# sequences are long; all three conditions therefore use 64 examples/update.
[category_comparison]
status = "planned_not_trained"
architectures = ["transformer", "mlp"]
model_seeds = [17, 42, 314159]
records_per_task = 500000
equal_optimizer_updates = true
representation_landmark = "<ONE_END>"
analyses = ["layerwise_cka", "linear_probe", "few_shot_transfer"]

[[category_comparison.conditions]]
name = "encoding_e4"
tasks = ["to_cycle", "to_lehmer", "to_inversion_vector", "to_reduced_word"]
micro_batch_size = 4
gradient_accumulation_steps = 16

[[category_comparison.conditions]]
name = "statistics_s4"
tasks = ["length", "cycle_type", "rsk_shape", "pattern_avoidance"]
micro_batch_size = 16
gradient_accumulation_steps = 4

[[category_comparison.conditions]]
name = "algebra_a4"
tasks = ["inverse", "compose", "right_multiply_simple", "bruhat_leq"]
micro_batch_size = 16
gradient_accumulation_steps = 4
